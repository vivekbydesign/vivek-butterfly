<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07060a">
<title>Release your butterfly</title>
<style>
  :root { --pink: #ff8fc8; --ink: #f6eef4; --mute: #a99aa6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: radial-gradient(120% 80% at 50% 0%, #2a1024 0%, #07060a 60%); color: var(--ink); font-family: -apple-system, "SF Pro Text", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: flex; flex-direction: column; padding: max(28px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom)); max-width: 480px; margin: 0 auto; }
  h1 { font-size: 30px; line-height: 1.1; font-weight: 600; margin: 8px 0 8px; letter-spacing: -0.01em; }
  p { color: var(--mute); margin: 0; font-size: 16px; line-height: 1.45; }
  .stage { flex: 1; display: grid; place-items: center; min-height: 300px; position: relative; perspective: 700px; }
  .bf { position: relative; width: 82%; aspect-ratio: 4/3; transform-style: preserve-3d; }
  .bf .w { position: absolute; top: 0; height: 100%; background-repeat: no-repeat; background-size: auto 100%; filter: drop-shadow(0 0 18px rgba(255,143,200,.35)); }
  .bf .l { transform-origin: 100% 50%; animation: flapL 0.9s ease-in-out infinite; }
  .bf .r { transform-origin: 0% 50%; animation: flapR 0.9s ease-in-out infinite; }
  @keyframes flapL { 0%,100% { transform: rotateY(0deg); } 50% { transform: rotateY(62deg); } }
  @keyframes flapR { 0%,100% { transform: rotateY(0deg); } 50% { transform: rotateY(-62deg); } }
  .ghost { width: 78%; opacity: .5; }
  .ghost svg { width: 100%; }
  .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; height: 56px; border-radius: 16px; border: 0; font-size: 17px; font-weight: 600; cursor: pointer; }
  .primary { background: linear-gradient(135deg, #ffb3d9, #ff6fae); color: #2a0618; box-shadow: 0 10px 40px rgba(255,111,174,.35); }
  .secondary { background: rgba(255,255,255,.08); color: var(--ink); margin-top: 10px; }
  .btn:disabled { opacity: .5; }
  input[type=text] { width: 100%; height: 52px; border-radius: 14px; border: 1px solid rgba(255,255,255,.14); background: rgba(255,255,255,.06); color: var(--ink); font-size: 17px; padding: 0 16px; margin-bottom: 12px; outline: none; }
  input[type=text]:focus { border-color: var(--pink); }
  .err { color: #ffb4b4; font-size: 15px; margin: 10px 0; min-height: 1em; text-align: center; }
  .hidden { display: none !important; }
  .done { text-align: center; }
  .done .big { font-size: 64px; }
  a { color: var(--pink); }
  .spin { width: 40px; height: 40px; border-radius: 50%; border: 3px solid rgba(255,255,255,.15); border-top-color: var(--pink); animation: s .8s linear infinite; }
  @keyframes s { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<main>
  <section id="s-capture">
    <h1>Release your butterfly</h1>
    <p>Lay your sheet flat in good light. Include all four black corner squares so only the butterfly is cut out.</p>
  </section>
  <section id="s-preview" class="hidden">
    <h1>Here it is</h1>
    <p>If it looks right, give it a name and send it to the big screen.</p>
  </section>
  <section id="s-done" class="hidden done">
    <h1>Look up!</h1>
    <p>Your butterfly is coming to life on the big screen.</p>
  </section>

  <div class="stage">
    <div id="ghost" class="ghost"></div>
    <div id="spin" class="spin hidden"></div>
    <div id="bf" class="bf hidden"><div class="w l"></div><div class="w r"></div></div>
  </div>

  <div class="err" id="err"></div>

  <div id="a-capture">
    <input id="file" type="file" accept="image/*" capture="environment" class="hidden">
    <button class="btn primary" id="shoot">Take a photo</button>
    <button class="btn secondary" id="pick">Choose from library</button>
  </div>
  <div id="a-preview" class="hidden">
    <input id="name" type="text" maxlength="40" placeholder="Your name (optional)" autocomplete="given-name">
    <button class="btn primary" id="send">Send to the wall</button>
    <button class="btn secondary" id="retake">Retake</button>
  </div>
  <div id="a-done" class="hidden">
    <button class="btn secondary" id="again">Make another</button>
  </div>
</main>
<script type="module">
  import { extractButterfly } from './process.js?v=20261121d';
  import { templateSvg } from './shape.js?v=20261121d';
  import { sendButterfly } from './net.js?v=20261121d';
  const $ = (id) => document.getElementById(id);
  $('ghost').innerHTML = templateSvg({ stroke: '#ff8fc8', width: 1.2 });
  let result = null;

  const show = (step) => {
    for (const s of ['capture', 'preview', 'done']) { $('s-' + s).classList.toggle('hidden', s !== step); $('a-' + s).classList.toggle('hidden', s !== step); }
  };
  const openPicker = (camera) => { camera ? $('file').setAttribute('capture', 'environment') : $('file').removeAttribute('capture'); $('file').click(); };
  $('shoot').onclick = () => openPicker(true);
  $('pick').onclick = () => openPicker(false);
  $('retake').onclick = () => openPicker(true);
  $('again').onclick = () => { result = null; $('bf').classList.add('hidden'); $('ghost').classList.remove('hidden'); show('capture'); };

  $('file').onchange = async (e) => {
    const f = e.target.files[0]; e.target.value = '';
    if (!f) return;
    $('err').textContent = '';
    $('ghost').classList.add('hidden'); $('bf').classList.add('hidden'); $('spin').classList.remove('hidden');
    try {
      await new Promise((r) => setTimeout(r, 30));
      result = await extractButterfly(f);
      const url = result.canvas.toDataURL('image/png');
      const { width: w, height: h } = result.canvas, cx = result.cx;
      const bf = $('bf');
      bf.style.aspectRatio = `${w} / ${h}`;
      const [l, r] = bf.children;
      l.style.cssText = `left:0;width:${(cx / w) * 100}%;background-image:url(${url});background-position:0 0;`;
      r.style.cssText = `left:${(cx / w) * 100}%;width:${(1 - cx / w) * 100}%;background-image:url(${url});background-position:100% 0;`;
      bf.classList.remove('hidden');
      show('preview');
    } catch (err) {
      $('err').textContent = err.message;
      $('ghost').classList.remove('hidden');
      show('capture');
    } finally { $('spin').classList.add('hidden'); }
  };

  $('send').onclick = async () => {
    if (!result) return;
    $('send').disabled = true; $('err').textContent = '';
    try {
      await sendButterfly(result.canvas.toDataURL('image/png'), $('name').value);
      show('done');
    } catch (err) { $('err').textContent = 'Could not send: ' + err.message; }
    finally { $('send').disabled = false; }
  };
</script>
</body>
</html>
