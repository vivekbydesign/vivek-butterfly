name: Archive new butterflies
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - id: run
        run: |
          node .github/archive.mjs
          if [ -n "$(git status --porcelain garden)" ]; then
            git config user.name "garden-bot"; git config user.email "garden-bot@users.noreply.github.com"
            git add garden && git commit -qm "Archive new butterflies" && git push -q
            echo "changed=1" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.run.outputs.changed == '1'
        uses: actions/configure-pages@v5
      - if: steps.run.outputs.changed == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - if: steps.run.outputs.changed == '1'
        uses: actions/deploy-pages@v4
