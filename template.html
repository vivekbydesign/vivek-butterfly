<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Butterfly colouring sheet</title>
<style>
  @page { size: landscape; margin: 0; }
  html, body { margin: 0; background: #e9e7e3; font-family: ui-sans-serif, -apple-system, "Segoe UI", Helvetica, sans-serif; color: #111; }
  .sheet { background: #fff; width: 279mm; height: 215mm; margin: 24px auto; padding: 9mm 11mm 8mm; box-sizing: border-box; display: grid; grid-template-rows: auto 1fr auto; gap: 3mm; box-shadow: 0 6px 40px rgba(0,0,0,.14); overflow: hidden; }
  header { display: flex; align-items: baseline; justify-content: space-between; }
  h1 { font-size: 21pt; font-weight: 800; letter-spacing: -.01em; margin: 0; }
  .name { font-size: 11pt; color: #555; }
  .name span { display: inline-block; width: 62mm; border-bottom: 0.4mm solid #999; margin-left: 2mm; }
  .art { min-height: 0; display: grid; place-items: center; }
  .art svg { height: 100%; width: 100%; }
  footer { display: grid; grid-template-columns: repeat(3, 1fr) auto; gap: 6mm; align-items: center; border-top: 0.3mm solid #ddd; padding-top: 3mm; }
  .step { display: flex; gap: 2.5mm; align-items: flex-start; font-size: 9.5pt; line-height: 1.3; color: #333; }
  .step b { flex: none; width: 6mm; height: 6mm; border-radius: 50%; background: #111; color: #fff; font-size: 8.5pt; display: grid; place-items: center; }
  footer img { width: 22mm; height: 22mm; }
  .print { position: fixed; top: 16px; right: 16px; display: flex; gap: 8px; }
  .print a, .print button { padding: 10px 16px; border-radius: 999px; border: 0; background: #111; color: #fff; font: 14px inherit; text-decoration: none; cursor: pointer; }
  @media print { html, body { background: #fff; } .sheet { box-shadow: none; margin: 0; } .print { display: none; } }
</style>
</head>
<body>
<div class="print"><button onclick="print()">Print</button></div>
<div class="sheet">
  <header>
    <h1>Bring your butterfly to life</h1>
    <div class="name">Name<span></span></div>
  </header>
  <div class="art" id="art"></div>
  <footer>
    <div class="step"><b>1</b><span>Colour every part of the wings, boldly and right to the lines.</span></div>
    <div class="step"><b>2</b><span>Lay the sheet flat in good light. Keep all four black squares in the photo.</span></div>
    <div class="step"><b>3</b><span>Scan the code, take the photo and watch your butterfly fly onto the big screen.</span></div>
    <img id="qr" alt="Scan to upload">
  </footer>
</div>
<script type="module">
  import { sheetSvg } from './shape.js';
  import { qrSrc } from './net.js';
  qrSrc().then((s) => { document.getElementById('qr').src = s; });
  document.getElementById('art').innerHTML = sheetSvg({ width: 1.25 });
</script>
</body>
</html>
